  <rect width="1200" height="430" rx="16" fill="url(#bgW)" stroke="#1E293B" stroke-width="2"/>
  <text x="600" y="38" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="800">FLUSSO DECISIONALE &amp; CICLO DI ESECUZIONE DETERMINISTICO (AM-SDK v3.0)</text>
  <rect x="40" y="155" width="185" height="110" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="132" y="185" text-anchor="middle" fill="#38BDF8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">1. INPUT UTENTE</text>
  <text x="132" y="210" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Prompt in Chat / IDE</text>
  <text x="132" y="232" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Intercettato da</text>
  <text x="132" y="248" text-anchor="middle" fill="#FDE68A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600">guardrail_pre_invoc.py</text>
  <line x1="225" y1="210" x2="270" y2="210" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrW)"/>
  <rect x="275" y="130" width="225" height="160" rx="10" fill="#171625" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="387" y="158" text-anchor="middle" fill="#F59E0B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">2. SMISTAMENTO</text>
  <text x="387" y="182" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Analisi Semantica &amp; Contesto</text>
  <text x="292" y="208" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">• Chat generica → Groq LPU (0 tok)</text>
  <text x="292" y="230" fill="#6EE7B7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">• Studio / REA / &gt;250 righe → GLOBAL</text>
  <text x="292" y="252" fill="#7DD3FC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">• Funzione / Bug isolato → SURGICAL</text>
  <text x="292" y="274" fill="#C084FC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">• "usa il tuo" → Nativo sbloccato</text>
  <path d="M 500 175 L 545 175 L 545 115 L 585 115" fill="none" stroke="#10B981" stroke-width="2.2" marker-end="url(#arrG)"/>
  <rect x="590" y="65" width="310" height="115" rx="10" fill="#091D1B" stroke="#10B981" stroke-width="1.5"/>
  <text x="610" y="90" fill="#10B981" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">3A. TIER GLOBALE (1.000.000 TOKEN)</text>
  <text x="610" y="114" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Nemotron 3.5 Lightning (~20s)</text>
  <text x="610" y="136" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Nemotron 3 Ultra 550B (Timeout 120s)</text>
  <text x="610" y="158" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Primo approccio, librerie esterne, REA, multi-file</text>
  <path d="M 500 245 L 545 245 L 545 305 L 585 305" fill="none" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrW)"/>
