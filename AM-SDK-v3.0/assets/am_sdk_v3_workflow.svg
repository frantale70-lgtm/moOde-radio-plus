  <text x="610" y="275" fill="#38BDF8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">3B. TIER CHIRURGICO (~3,4 SECONDI)</text>
  <text x="610" y="299" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Mistral Codestral Latest (256k)</text>
  <text x="610" y="321" fill="#BAE6FD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600">Agente Specialistico via Aider CLI</text>
  <text x="610" y="343" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Si piega una funzione o un bug mirato e corregge</text>
  <path d="M 900 122 L 935 122 L 935 195 L 965 195" fill="none" stroke="#10B981" stroke-width="2.2" marker-end="url(#arrG)"/>
  <path d="M 900 307 L 935 307 L 935 225 L 965 225" fill="none" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrW)"/>
  <rect x="970" y="125" width="190" height="170" rx="10" fill="#131C31" stroke="#10B981" stroke-width="1.8"/>
  <text x="1065" y="153" text-anchor="middle" fill="#10B981" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">4. VERIFICA &amp; QA</text>
  <text x="1065" y="177" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Smart Verify</text>
  <text x="1065" y="198" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">.py / .ino / .cpp / .json</text>
  <line x1="990" y1="214" x2="1140" y2="114" stroke="#334155" opacity="0"/>
  <text x="1065" y="236" text-anchor="middle" fill="#6EE7B7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">OK → Commit / Fine</text>
  <text x="1065" y="258" text-anchor="middle" fill="#FDA4AF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">KO → Rollback .agy_backup</text>
  <text x="1065" y="278" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">&amp; Failover al nodo successivo</text>
</svg>
